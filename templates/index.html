<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>🐱 猫咪家庭满意度指数分析器</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
:root {
  --bg: #7dd3fc;
  --card: #ffffff;
  --ink: #3b2f2f;
  --muted: #5b6770;
  --accent: #f97316;
  --accent-soft: #fed7aa;
  --green: #10b981;
  --blue: #3b82f6;
  --red: #ef4444;
  --gold: #f59e0b;
  --sky1: #38bdf8;
  --sky2: #7dd3fc;
  --radius: 0px;
  --shadow: 6px 6px 0 rgba(2, 132, 199, 0.22);
  --border: 3px solid #ffffff;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'PixelZh', 'PingFang SC', 'Hiragino Sans GB', monospace;
  background: linear-gradient(180deg, #38bdf8 0%, #7dd3fc 42%, #bae6fd 76%, #e0f2fe 100%);
  background-attachment: fixed;
  color: var(--ink);
  min-height: 100vh;
  padding-bottom: 48px;
}
.container { max-width: 1200px; margin: 0 auto; padding: 24px 20px; }

/* ---------- 顶栏 ---------- */
.topbar {
  display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 14px;
  margin-bottom: 22px;
}
.report-title { font-size: 26px; font-weight: 800; letter-spacing: 4px; text-align: center; justify-self: center; text-shadow: 2px 2px 0 rgba(255,255,255,.8); }
.topbar-side { display: flex; align-items: center; justify-content: flex-start; justify-self: start; }
.toolbar { display: flex; align-items: center; gap: 16px; justify-content: flex-end; justify-self: end; }
.btn-report {
  background: transparent; border: none; box-shadow: none; cursor: pointer; padding: 0;
  font-family: inherit; font-size: 18px; font-weight: 700; color: var(--ink); letter-spacing: 2px;
  transition: transform .12s ease, opacity .12s ease;
}
.btn-report:hover { transform: translateY(-1px); color: var(--accent); }
.btn-report:active { transform: scale(.94); }
.btn-music { background: transparent; border: none; box-shadow: none; padding: 0; cursor: pointer; display: inline-flex; transition: transform .12s ease; }
.btn-music:hover { transform: scale(1.1); }
.btn-music:active { transform: scale(.94); }
.music-icon { width: 46px; height: 46px; image-rendering: pixelated; display: block; }
.quiz-music { position: fixed; top: 14px; right: 16px; z-index: 9995; }
#noteLayer { position: fixed; inset: 0; pointer-events: none; z-index: 9999; overflow: hidden; }
#confettiCanvas { position: fixed; inset: 0; pointer-events: none; z-index: 9998; }
.flow-note {
  position: absolute; background: url('/static/icons/note.png') center/contain no-repeat;
  image-rendering: pixelated; opacity: 0;
  filter: drop-shadow(0 0 1px #fff) drop-shadow(0 0 2px rgba(255,255,255,.9));
  animation: noteFlow 1.6s ease-out forwards;
}
@keyframes noteFlow {
  0% { opacity: 0; transform: translate(0, 0) scale(.4); }
  15% { opacity: .95; }
  100% { opacity: 0; transform: translate(var(--dx), var(--dy)) scale(1) rotate(var(--rot)); }
}

/* ---------- Hero：综合指数 ---------- */
.hero {
  display: flex; align-items: center; gap: 28px; flex-wrap: wrap;
  background: rgba(255, 255, 255, 0.94); border: var(--border); border-radius: var(--radius);
  box-shadow: var(--shadow); padding: 28px 30px; margin-bottom: 22px;
}
.score-ring-wrap { position: relative; width: 150px; height: 150px; flex-shrink: 0; }
.score-ring { transform: rotate(-90deg); }
.score-ring .track { fill: none; stroke: #f5e9df; stroke-width: 14; }
.score-ring .fill {
  fill: none; stroke: url(#ringGrad); stroke-width: 14; stroke-linecap: round;
  transition: stroke-dashoffset .8s cubic-bezier(.22,1,.36,1);
}
.ring-center {
  position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
}
.ring-center .num { font-size: 42px; font-weight: 800; line-height: 1; }
.ring-center .label { font-size: 12px; color: var(--muted); margin-top: 6px; }
.hero-info { flex: 1; min-width: 260px; }
.grade {
  display: inline-flex; align-items: center; gap: 8px; padding: 8px 16px; border-radius: 999px;
  font-size: 16px; font-weight: 700; color: #fff; margin-bottom: 10px;
  box-shadow: 0 4px 14px rgba(0,0,0,.15);
}
.grade .tag { font-size: 12px; font-weight: 600; opacity: .9; background: rgba(255,255,255,.25); padding: 2px 8px; border-radius: 999px; }
.hero-desc { font-size: 15px; color: #6b5b52; line-height: 1.6; }
.projection {
  margin-top: 14px; padding: 12px 16px; border-radius: 0; background: #f0fdf4; border: 2px solid #ffffff;
  box-shadow: 3px 3px 0 rgba(2, 132, 199, 0.16); font-size: 14px; color: #166534;
}
.projection b { font-size: 18px; }

/* ---------- 结果页：猫咪坠落 + 评语气泡 ---------- */
.cat-land { display: flex; flex-direction: column; align-items: center; gap: 10px; flex-shrink: 0; }
.cat-fall { position: relative; width: 110px; height: 96px; }
.cat-fall img {
  width: 96px; height: 96px; object-fit: contain;
  image-rendering: pixelated; opacity: 0;
}
.cat-land.drop .cat-fall img {
  opacity: 1;
  animation: catDrop .85s cubic-bezier(.3, 1.15, .45, 1) forwards;
}
@keyframes catDrop {
  0%   { transform: translateY(-360px) rotate(26deg); opacity: 0; }
  12%  { opacity: 1; }
  55%  { transform: translateY(0) rotate(-8deg) scale(1.06); }
  70%  { transform: translateY(-18px) rotate(3deg) scale(1); }
  85%  { transform: translateY(0) rotate(0) scale(1.02); }
  100% { transform: translateY(0) rotate(0) scale(1); }
}
.cat-fall::after {
  content: ''; position: absolute; left: 50%; bottom: -2px; transform: translateX(-50%);
  width: 54px; height: 8px; border-radius: 50%;
  background: rgba(2, 132, 199, .22); opacity: 0;
}
.cat-land.drop .cat-fall::after {
  animation: shadowIn .85s ease forwards;
}
@keyframes shadowIn {
  0%   { opacity: 0; transform: translateX(-50%) scale(.4); }
  55%  { opacity: 1; transform: translateX(-50%) scale(1.15); }
  75%  { opacity: 1; transform: translateX(-50%) scale(.85); }
  100% { opacity: 1; transform: translateX(-50%) scale(1); }
}
.cat-bubble {
  position: relative; max-width: 280px; min-width: 220px;
  background: #fff; border: 3px solid #3b2f2f;
  padding: 12px 14px; box-shadow: 5px 5px 0 rgba(2, 132, 199, .22);
  opacity: 0; transform: scale(.5); transform-origin: top center;
}
.cat-bubble::before {
  content: ''; position: absolute; top: -15px; left: 50%; transform: translateX(-50%);
  width: 0; height: 0;
  border-left: 10px solid transparent; border-right: 10px solid transparent;
  border-bottom: 13px solid #3b2f2f;
}
.cat-bubble::after {
  content: ''; position: absolute; top: -9px; left: 50%; transform: translateX(-50%);
  width: 0; height: 0;
  border-left: 8px solid transparent; border-right: 8px solid transparent;
  border-bottom: 11px solid #fff;
}
.cat-land.drop .cat-bubble {
  animation: bubblePop .45s cubic-bezier(.3, 1.6, .5, 1) .55s forwards;
}
@keyframes bubblePop {
  from { opacity: 0; transform: scale(.5); }
  to   { opacity: 1; transform: scale(1); }
}
.bubble-label { font-size: 13px; font-weight: 800; color: var(--accent); letter-spacing: 2px; margin-bottom: 5px; }
.bubble-comment { font-size: 13px; line-height: 1.55; color: #4b3b38; margin: 0; }

/* ---------- 证书 ---------- */
.cert-section { display: flex; flex-direction: column; align-items: center; gap: 10px; margin: 20px 0 6px; }
.btn-cert {
  background: linear-gradient(135deg, #fbbf24, #f59e0b); color: #fff;
  border: 3px solid #ffffff; border-radius: 0;
  padding: 14px 38px; font-family: inherit; font-size: 20px; font-weight: 800; letter-spacing: 4px;
  cursor: pointer; box-shadow: var(--shadow);
  transition: transform .12s ease;
}
.btn-cert:hover { transform: translateY(-2px); }
.btn-cert:active { transform: scale(.95); }
.cert-hint { font-size: 13px; color: var(--muted); }

.cert-modal { position: fixed; inset: 0; z-index: 10000; display: none; align-items: center; justify-content: center; padding: 20px; }
.cert-modal.show { display: flex; }
.cert-backdrop { position: absolute; inset: 0; background: rgba(20, 30, 40, .6); }
.cert-card {
  position: relative; z-index: 1; display: flex; flex-direction: column; align-items: center; gap: 16px;
  animation: certPop .35s cubic-bezier(.3, 1.5, .5, 1);
}
@keyframes certPop { from { opacity: 0; transform: scale(.7); } to { opacity: 1; transform: scale(1); } }
.cert-img {
  width: auto; height: auto; max-width: min(84vw, 430px); max-height: 72vh;
  border: 4px solid #ffffff; box-shadow: var(--shadow); background: #fff;
}
.cert-close {
  position: absolute; top: -14px; right: -14px; width: 36px; height: 36px; border-radius: 50%;
  background: var(--ink); color: #fff; border: 3px solid #fff; cursor: pointer;
  font-family: inherit; font-size: 16px; line-height: 1; display: flex; align-items: center; justify-content: center;
  transition: transform .12s ease;
}
.cert-close:hover { transform: scale(1.1); }
.btn-cert-save {
  background: var(--ink); color: #fff; text-decoration: none;
  border: 3px solid #ffffff; border-radius: 0; padding: 11px 28px;
  font-size: 16px; font-weight: 700; letter-spacing: 3px; box-shadow: var(--shadow);
  transition: transform .12s ease; display: inline-flex; align-items: center; gap: 8px;
}
.btn-cert-save:hover { transform: translateY(-2px); }
.btn-cert-save:active { transform: scale(.95); }

/* ---------- 立绘海报环节：黑幕 → 海报 pop-up ---------- */
#posterOverlay {
  position: fixed; inset: 0; z-index: 9997;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  background: #000; padding: 24px;
  opacity: 0; pointer-events: none;
  transition: opacity .65s ease;
}
#posterOverlay.show { opacity: 1; pointer-events: auto; }
.poster-img {
  width: auto; height: auto; max-width: min(80vw, 520px); max-height: 68vh;
  object-fit: contain; background: transparent;
  border: none; filter: drop-shadow(0 12px 34px rgba(0,0,0,.75));
  opacity: 0; transform: scale(.3);
  transition: transform .55s cubic-bezier(.34, 1.56, .64, 1), opacity .4s ease;
}
#posterOverlay.show .poster-img {
  opacity: 1; transform: scale(1);
  transition-delay: .3s;
}
.btn-view-report {
  margin-top: 34px; font-family: inherit; font-size: 18px; font-weight: 800; letter-spacing: 4px;
  color: #fff; background: var(--accent); border: 3px solid #fff; border-radius: 0;
  padding: 14px 38px; cursor: pointer; box-shadow: 0 6px 0 rgba(255,255,255,.22);
  opacity: 0; transform: translateY(18px);
  transition: transform .2s ease, opacity .45s ease, box-shadow .12s ease, background .12s ease;
}
#posterOverlay.show .btn-view-report {
  opacity: 1; transform: translateY(0);
  transition-delay: .85s;
}
.btn-view-report:hover { transform: translateY(-2px); box-shadow: 0 9px 0 rgba(255,255,255,.22); background: #e8620a; }
.btn-view-report:active { transform: translateY(2px); box-shadow: 0 2px 0 rgba(255,255,255,.22); }

/* ---------- 主布局 ---------- */
.layout { display: grid; grid-template-columns: 1fr; gap: 22px; }
.panel { background: rgba(255, 255, 255, 0.94); border: var(--border); border-radius: var(--radius); box-shadow: var(--shadow); padding: 22px; }
.panel h2 { font-size: 17px; font-weight: 800; margin-bottom: 16px; display: flex; align-items: center; gap: 8px; }
.panel h2 .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); }

/* ---------- 维度输入卡片 ---------- */
.dim-card { border: 1px solid #f3e6da; border-radius: 14px; margin-bottom: 14px; overflow: hidden; }
.dim-head {
  display: flex; align-items: center; justify-content: space-between; gap: 10px;
  padding: 14px 16px; cursor: pointer; user-select: none; background: #fffdfa;
}
.dim-head:hover { background: #fff7ed; }
.dim-title { display: flex; align-items: center; gap: 10px; }
.dim-title .emoji { font-size: 20px; }
.dim-title .name { font-weight: 700; font-size: 15px; }
.dim-title .weight { font-size: 12px; color: var(--muted); background: #f5e9df; padding: 2px 8px; border-radius: 8px; }
.dim-avg { display: flex; align-items: center; gap: 8px; }
.dim-avg .avg-num { font-weight: 800; font-size: 16px; }
.chevron { transition: transform .25s ease; color: var(--muted); }
.dim-card.open .chevron { transform: rotate(180deg); }
.dim-body { display: none; padding: 6px 16px 16px; }
.dim-card.open .dim-body { display: block; }
.dim-summary { font-size: 12.5px; color: var(--muted); margin-bottom: 8px; padding-left: 30px; }

/* 滑杆 */
.indicator { padding: 10px 0 10px 30px; border-top: 1px dashed #f6ece3; }
.indicator:first-of-type { border-top: none; }
.ind-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.ind-name { font-size: 14px; font-weight: 600; }
.ind-desc { font-size: 12px; color: var(--muted); margin: 3px 0 8px; line-height: 1.5; }
.ind-val { font-weight: 800; font-size: 14px; min-width: 34px; text-align: right; }
.slider-row { display: flex; align-items: center; gap: 12px; }
input[type=range] {
  -webkit-appearance: none; appearance: none; flex: 1; height: 8px; border-radius: 8px;
  background: #f3e6da; outline: none; cursor: pointer;
}
input[type=range]::-webkit-slider-thumb {
  -webkit-appearance: none; appearance: none; width: 22px; height: 22px; border-radius: 50%;
  background: #fff; border: 3px solid var(--accent); cursor: pointer; box-shadow: 0 2px 6px rgba(0,0,0,.18);
  transition: border-color .2s;
}
input[type=range]::-moz-range-thumb {
  width: 22px; height: 22px; border-radius: 50%; background: #fff; border: 3px solid var(--accent); cursor: pointer;
}

/* ---------- 结果面板 ---------- */
.chart-box { position: relative; height: 300px; margin-bottom: 10px; }
.chart-caption { font-size: 12px; color: var(--muted); text-align: center; margin-bottom: 18px; }
.weak-list { display: flex; flex-direction: column; gap: 12px; }
.weak-item { border: 2px solid #ffffff; border-radius: 0; padding: 14px 16px; background: #ffffff; box-shadow: 3px 3px 0 rgba(2, 132, 199, 0.16); }
.weak-top { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 6px; }
.weak-name { font-weight: 700; font-size: 14.5px; }
.weak-score { font-weight: 800; font-size: 15px; }
.weak-cat { font-size: 11px; color: #b45309; background: #fef3c7; padding: 2px 8px; border-radius: 8px; }
.weak-meta { font-size: 12px; color: var(--muted); margin-bottom: 8px; }
.tip-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 14px; font-size: 12.5px; }
.tip-grid div { color: #6b5b52; line-height: 1.45; }
.tip-grid .k { color: var(--accent); font-weight: 700; }
.empty-tip { text-align: center; color: var(--muted); padding: 20px; font-size: 14px; }

footer { text-align: center; color: var(--muted); font-size: 12px; margin-top: 28px; }

/* ---------- 开场像素动画 ---------- */
#intro {
  position: fixed; inset: 0; z-index: 9999;
  background: linear-gradient(180deg, #38bdf8 0%, #7dd3fc 42%, #bae6fd 76%, #e0f2fe 100%);
  display: flex; align-items: flex-start; justify-content: center;
  overflow: hidden;
  transition: opacity .65s ease;
}
#intro.fade-out { opacity: 0; pointer-events: none; }
#skyCanvas { position: absolute; inset: 0; width: 100%; height: 100%; }

.intro-content {
  position: relative; z-index: 2; text-align: center;
  padding: calc(8vh + 30px) 22px 0;
  display: flex; flex-direction: column; align-items: center; gap: 30px;
}

@font-face {
  font-family: 'PixelZh';
  src: url('/static/fonts/Zpix-fixed.ttf') format('truetype');
  font-weight: normal; font-style: normal; font-display: swap;
}

.pixel-title {
  font-family: 'PixelZh', 'PingFang SC', monospace;
  font-size: clamp(42px, 9vw, 96px);
  font-weight: normal; letter-spacing: .03em; line-height: 1.28;
  color: #fde047;
  -webkit-font-smoothing: none;
  -moz-osx-font-smoothing: grayscale;
  font-smooth: never;
  animation: titleFloat 3.2s ease-in-out infinite;
}
.pixel-title .ch { display: inline-block; animation: titlePop .5s cubic-bezier(.2,1.6,.4,1) both; }
@keyframes titlePop {
  0% { transform: translateY(46px) scale(.3); opacity: 0; }
  60% { transform: translateY(-6px) scale(1.12); opacity: 1; }
  100% { transform: translateY(0) scale(1); opacity: 1; }
}
@keyframes titleFloat {
  0%,100% { transform: translateY(0); }
  50% { transform: translateY(-9px); }
}

.intro-sub {
  font-size: 14px; letter-spacing: .16em; color: #0c4a6e; font-weight: 600;
  opacity: 0; animation: fadeUp .5s ease 1.25s forwards;
}
@keyframes fadeUp { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }

.start-btn {
  position: relative;
  font-family: 'PixelZh', 'PingFang SC', monospace;
  font-size: 15px; font-weight: normal; letter-spacing: .08em;
  color: #713f12; cursor: pointer;
  padding: 11px 30px;
  background: rgba(253, 224, 71, 0.5);
  border: 2px solid rgba(255, 251, 235, 0.85); border-radius: 4px;
  box-shadow: 0 4px 0 rgba(146, 64, 14, 0.55), 0 10px 20px rgba(2,132,199,.16);
  backdrop-filter: blur(3px);
  text-shadow: 0 1px 0 rgba(255,255,255,.45);
  transition: transform .12s ease, box-shadow .12s ease, background .12s ease;
  animation: btnBounce 1.9s ease-in-out infinite;
}
.start-btn:hover { background: rgba(253, 224, 71, 0.7); transform: translateY(-2px); box-shadow: 0 6px 0 rgba(146, 64, 14, 0.5), 0 14px 24px rgba(2,132,199,.2); }
.start-btn:active { transform: translateY(3px); box-shadow: 0 1px 0 rgba(146, 64, 14, 0.55), 0 4px 10px rgba(2,132,199,.18); }
@keyframes btnBounce {
  0%,100% { transform: translateY(0); }
  50% { transform: translateY(-7px); }
}

/* 猫咪掉落时飘出的 "喵~" 气泡 */
.meow-float {
  position: absolute; z-index: 3; font-family: 'PixelZh', 'PingFang SC', monospace;
  font-size: 26px; color: #fff; pointer-events: none;
  -webkit-text-stroke: 2px #0f172a; text-shadow: 0 4px 0 rgba(2,132,199,.5);
  transform: translate(-50%, -50%);
  animation: meowRise 1.05s ease-out forwards;
}
@keyframes meowRise {
  0% { opacity: 0; transform: translate(-50%, -20%) scale(.3); }
  20% { opacity: 1; transform: translate(-50%, -60%) scale(1.15); }
  100% { opacity: 0; transform: translate(-50%, -180%) scale(1); }
}

/* ---------- 测评环节：像素游戏对话框 ---------- */
#quiz {
  position: fixed; inset: 0; z-index: 9990;
  background: linear-gradient(180deg, #38bdf8 0%, #7dd3fc 42%, #bae6fd 76%, #e0f2fe 100%);
  display: flex; align-items: center; justify-content: center;
  opacity: 0; pointer-events: none;
}
#quiz.show { opacity: 1; pointer-events: auto; }
#quiz::after {
  content: ''; position: absolute; left: 0; right: 0; bottom: 0; height: 16vh; z-index: 0;
  background: repeating-linear-gradient(90deg, #fbd79a 0 14px, #f4c67c 14px 28px);
  border-top: 4px solid #3b2f2f;
}
.quiz-stage { position: relative; z-index: 1; width: min(680px, 92vw); display: flex; flex-direction: column; gap: 14px; }
.quiz-hud { display: flex; align-items: center; gap: 12px; }
.quiz-progress-label { font-family: 'PixelZh','PingFang SC',monospace; font-size: 15px; color: #0c4a6e; font-weight: 700; text-shadow: 1px 1px 0 rgba(255,255,255,.6); white-space: nowrap; }
.quiz-progress-bar { flex: 1; height: 14px; background: #fff; border: 3px solid #3b2f2f; border-radius: 0; box-shadow: 2px 2px 0 rgba(2,132,199,.3); overflow: hidden; }
.quiz-progress-fill { height: 100%; width: 0%; background: #f97316; transition: width .35s cubic-bezier(.22,1,.36,1); }
.dialog-box {
  background: #fffdfa; border: 4px solid #3b2f2f; border-radius: 0;
  box-shadow: 8px 8px 0 rgba(2, 132, 199, 0.35); padding: 18px 20px;
}
.dialog-top { display: flex; gap: 14px; align-items: flex-start; }
.dialog-avatar {
  flex-shrink: 0; width: 84px; height: 84px; border: 3px solid #3b2f2f; border-radius: 0;
  background: #fef3c7; box-shadow: 3px 3px 0 rgba(2,132,199,.28); overflow: hidden;
  display: flex; align-items: center; justify-content: center;
}
.dialog-avatar img { width: 100%; height: 100%; object-fit: contain; object-position: center bottom; image-rendering: pixelated; display: block; }
.dialog-text-wrap { flex: 1; min-height: 84px; }
.dialog-text { font-size: 17px; line-height: 1.6; font-weight: 600; min-height: 1.6em; }
.dialog-text.typing::after { content: '▼'; color: #f97316; animation: cursorBlink .9s steps(1) infinite; }
@keyframes cursorBlink { 0%,60% { opacity: 1; } 61%,100% { opacity: 0; } }
.dialog-options { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 16px; }
.option-btn {
  font-family: inherit; text-align: left; font-size: 14px; line-height: 1.4;
  background: #fff; border: 2px solid #3b2f2f; border-radius: 0;
  padding: 10px 12px; cursor: pointer; color: var(--ink);
  box-shadow: 3px 3px 0 rgba(2, 132, 199, 0.28);
  transition: transform .1s ease, box-shadow .1s ease, background .1s ease;
  display: flex; align-items: center; gap: 10px;
}
.option-btn .key {
  flex-shrink: 0; width: 24px; height: 24px; display: inline-flex; align-items: center; justify-content: center;

<script>
/* ================= 开场像素动画 ================= */
// 参考图风格的小白猫（4 帧透明 PNG，提取自参考图精灵表）
// cat0 站立 / cat1 蹲坐 / cat2 腾空 / cat3 落地
const CAT_FRAME_NAMES = ['cat0', 'cat1', 'cat2', 'cat3'];
const CAT_FRAMES = CAT_FRAME_NAMES.map(name => {
  const img = new Image();
  img.src = '/static/_frames/' + name + '.png';
  return img;
});
// 站立帧原生高度（像素），用于把 4 个姿态统一缩放到同一只猫的大小
const CAT_BASE_H = 452;
// 各动画状态对应帧：idle 站立 / anticipate 蹲坐 / jump 腾空 / land 落地 / fall 站立下落
const CAT_FRAME_BY_MODE = { idle: 0, anticipate: 1, jump: 2, land: 3, fall: 0 };
const CLOUD_SPRITE = [
  '...XXXXXXXX.....',
  '..XXXXXXXXXXXX..',
  '.XXXXXXXXXXXXXX.',
  'XXXXXXXXXXXXXXXX',
  'XXXXXXXXXXXXXXXX',
  '.XXXXXXXXXXXXXX.',
  '..XXXXXXXXXSSS..',
];
const CLOUD_PALETTE = { X: '#ffffff', S: '#dbeafe' };
const SUN_SPRITE = ['..GGG..', '.GGGGG.', 'GGGGGGG', '.GGGGG.', '..GGG..'];

function drawSprite(ctx, sprite, palette, px, ox, oy) {
  for (let r = 0; r < sprite.length; r++) {
    const row = sprite[r];
    for (let c = 0; c < row.length; c++) {
      const ch = row[c];
      if (ch === '.' || ch === ' ') continue;
      ctx.fillStyle = palette[ch] || '#000';
      ctx.fillRect(Math.floor(ox + c * px), Math.floor(oy + r * px), Math.ceil(px), Math.ceil(px));
    }
  }
}

// 天空场景画布
const sky = document.getElementById('skyCanvas');
const sctx = sky.getContext('2d');
const clouds = [
  { fx: 0.08, fy: 0.80, s: 1.00, sway: .40, ph: 0 },
  { fx: 0.26, fy: 0.64, s: 1.10, sway: .50, ph: 1 },
  { fx: 0.44, fy: 0.78, s: 0.95, sway: .45, ph: 2 },
  { fx: 0.62, fy: 0.60, s: 1.15, sway: .55, ph: 3 },
  { fx: 0.80, fy: 0.74, s: 1.00, sway: .50, ph: 4 },
  { fx: 0.95, fy: 0.58, s: 1.05, sway: .60, ph: 5 },
  { fx: 0.16, fy: 0.44, s: 0.70, sway: .50, ph: 6 },
  { fx: 0.70, fy: 0.42, s: 0.75, sway: .55, ph: 7 },
];
const sparkles = Array.from({ length: 10 }, (_, i) => ({
  fx: (i * 0.117 + 0.04) % 1, fy: (i * 0.233 + 0.05) % 1, ph: i, s: (i % 3) + 1,
}));
const cat = {
  ci: 0, mode: 'idle', t: 0,
  waitDur: 1.0, anticipateDur: 0.32, jumpDur: 0.9, landDur: 0.45,
  fallT: 0, fallDur: 1.2, fallFromX: 0, fallFromY: 0,
  blink: 1.4, tailPhase: 0,
};

function resizeSky() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  sky.width = Math.floor(sky.clientWidth * dpr);
  sky.height = Math.floor(sky.clientHeight * dpr);
  sctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
window.addEventListener('resize', resizeSky);
resizeSky();

function updateCat(dt) {
  cat.t += dt;
  cat.tailPhase += dt * (cat.mode === 'jump' ? 9 : 6);
  cat.blink += dt;
  const seq = ['idle', 'anticipate', 'jump', 'land'];
  const durs = { idle: cat.waitDur, anticipate: cat.anticipateDur, jump: cat.jumpDur, land: cat.landDur };
  if (cat.t >= durs[cat.mode]) {
    cat.t = 0;
    if (cat.mode === 'jump') cat.ci = (cat.ci + 1) % clouds.length;
    cat.mode = seq[(seq.indexOf(cat.mode) + 1) % seq.length];
  }
}

function drawKitten(cx, feetY, cpx, o = {}) {
  const idx = CAT_FRAME_BY_MODE[cat.mode] != null ? CAT_FRAME_BY_MODE[cat.mode] : 0;
  const img = CAT_FRAMES[idx] || CAT_FRAMES[0];
  if (!img.complete || !img.naturalWidth) return { bodyW: 0, bodyH: 0 };
  const H = 32 * cpx;               // 站立猫目标高度
  const k = H / CAT_BASE_H;         // 统一缩放系数，保持各姿态真实相对大小
  const bodyW = img.naturalWidth * k;
  const bodyH = img.naturalHeight * k;
  sctx.save();
  sctx.translate(cx, feetY);
  if (o.rot) sctx.rotate(o.rot);
  sctx.scale(o.sx || 1, o.sy || 1);
  sctx.imageSmoothingEnabled = false; // 像素风：邻近采样保持清晰
  sctx.drawImage(img, -bodyW / 2, -bodyH, bodyW, bodyH);
  sctx.restore();
  return { bodyW, bodyH };
}

let tops = [];

function drawScene(t, dt) {
  const w = sky.clientWidth, h = sky.clientHeight;
  sctx.clearRect(0, 0, w, h);

  // 太阳
  drawSprite(sctx, SUN_SPRITE, { G: '#fde047' }, 6, w * 0.82, h * 0.08);

  // 云朵
  tops = [];
  for (const c of clouds) {
    const cpx = Math.max(4, Math.round(6 * c.s));
    const x = (c.fx + Math.sin(t * c.sway + c.ph) * 0.025) * w;
    const topY = c.fy * h;
    const cw = CLOUD_SPRITE[0].length * cpx;
    drawSprite(sctx, CLOUD_SPRITE, CLOUD_PALETTE, cpx, x - cw / 2, topY);
    tops.push({ x, topY });
  }

  // 闪光点
  for (const sp of sparkles) {
    const a = 0.4 + 0.6 * Math.abs(Math.sin(t * 2 + sp.ph));
    sctx.fillStyle = `rgba(255,255,255,${a.toFixed(2)})`;
    sctx.fillRect(Math.floor(sp.fx * w), Math.floor(sp.fy * h), sp.s * 3, sp.s * 3);
  }

  // 小猫
  const cpx = Math.min(5, Math.max(3, Math.round(w / 95)));
  if (cat.mode === 'fall') {
    drawFallingCat(dt, cpx, h);
    return;
  }

  updateCat(dt);
  const N = clouds.length;
  const a = tops[cat.ci];
  const b = tops[(cat.ci + 1) % N];
  let cx, feetY, sx = 1, sy = 1, rot = 0;
  const blinking = (cat.blink % 3.4) < 0.13;

  if (cat.mode === 'idle') {
    const p = cat.t / cat.waitDur;
    cx = a.x;
    feetY = a.topY + Math.sin(p * Math.PI * 3) * 2.5;
    sx = 1 + Math.sin(p * Math.PI * 3) * 0.025;
    sy = 1 - Math.sin(p * Math.PI * 3) * 0.04;
  } else if (cat.mode === 'anticipate') {
    const p = cat.t / cat.anticipateDur;
    cx = a.x; feetY = a.topY;
    sx = 1 + p * 0.14; sy = 1 - p * 0.16;
  } else if (cat.mode === 'jump') {
    const p = cat.t / cat.jumpDur;
    const ease = p < .5 ? 2 * p * p : 1 - Math.pow(-2 * p + 2, 2) / 2;
    const air = Math.sin(ease * Math.PI);
    cx = a.x + (b.x - a.x) * ease;
    feetY = a.topY + (b.topY - a.topY) * ease - air * 0.16 * h;
    sy = 1 + air * 0.12; sx = 1 - air * 0.08;
    rot = (b.x >= a.x ? 1 : -1) * air * 0.18;
  } else {
    const p = cat.t / cat.landDur;
    const bounce = Math.sin(p * Math.PI);
    cx = a.x; feetY = a.topY;
    sx = 1 + bounce * 0.15; sy = 1 - bounce * 0.18;
  }

  drawKitten(cx, feetY, cpx, { sx, sy, rot, blink: blinking });
}

function drawFallingCat(dt, cpx, h) {
  cat.fallT += dt;
  cat.tailPhase += dt * 10;
  const p = Math.min(cat.fallT / cat.fallDur, 1);
  const ease = p * p; // 重力加速
  const targetY = h + 80; // 掉出画面底部
  const cy = cat.fallFromY + (targetY - cat.fallFromY) * ease;
  const cx = cat.fallFromX;
  const rot = ease * 0.65;
  const shrink = 1 - ease * 0.32;
  drawKitten(cx, cy, cpx, { sx: shrink, sy: shrink, rot });
}

let last = performance.now();
function frame(now) {
  const dt = Math.min((now - last) / 1000, 0.05);
  last = now;
  drawScene(now / 1000, dt);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

// 标题逐字弹出
const titleEl = document.getElementById('pixelTitle');
const titleLines = titleEl.innerHTML.split('<br>');
titleEl.innerHTML = titleLines.map(line =>
  Array.from(line).map((c, i) => `<span class="ch" style="animation-delay:${(0.15 + i * 0.06).toFixed(2)}s">${c}</span>`).join('')
).join('<br>');

// 合成 "喵~" 音效（Web Audio API，无需外部音频文件）
let _audioCtx = null;
function playMeow() {
  try {
    const Ctx = window.AudioContext || window.webkitAudioContext;
    if (!Ctx) return;
    if (!_audioCtx) _audioCtx = new Ctx();
    const ctx = _audioCtx;
    if (ctx.state === 'suspended') ctx.resume();
    const now = ctx.currentTime;
    const dur = 0.55;

    // 主音：锯齿波，起始较高后下滑（喵的核心滑音）
    const osc = ctx.createOscillator();
    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(720, now);
    osc.frequency.exponentialRampToValueAtTime(560, now + 0.16);
    osc.frequency.exponentialRampToValueAtTime(640, now + 0.28);
    osc.frequency.exponentialRampToValueAtTime(400, now + dur);

    // 颤音，让音色更接近真猫
    const vib = ctx.createOscillator();
    const vibGain = ctx.createGain();
    vib.frequency.value = 22;
    vibGain.gain.value = 16;
    vib.connect(vibGain);
    vibGain.connect(osc.frequency);

    // 音量包络：快速起音 → 渐弱
    const gain = ctx.createGain();
    gain.gain.setValueAtTime(0.0001, now);
    gain.gain.exponentialRampToValueAtTime(0.25, now + 0.03);
    gain.gain.setValueAtTime(0.25, now + 0.18);
    gain.gain.exponentialRampToValueAtTime(0.0001, now + dur);

    // 低通滤波柔化音色
    const filter = ctx.createBiquadFilter();
    filter.type = 'lowpass';
    filter.frequency.value = 1600;

    osc.connect(filter);
    filter.connect(gain);
    gain.connect(ctx.destination);
    osc.start(now);
    osc.stop(now + dur + 0.05);
    vib.start(now);
    vib.stop(now + dur + 0.05);
  } catch (e) { /* 静默忽略音频错误 */ }
}

// ===== 像素风背景音乐（8-bit 芯片音，类马力欧的欢快旋律）=====
function noteFreq(m) { return m == null ? 0 : 440 * Math.pow(2, (m - 69) / 12); }

// 32 步旋律（每步 = 八分音符，null 为休止），上行再回落的轻快弧线
const BGM_MELODY = [
  76, 79, 84, null, 79, 76, 84, null,
  74, 77, 81, null, 77, 74, 81, null,
  76, 79, 84, 86,   84, 79, 76, null,
  77, 74, 72, null, null, null, null, null,
];
// 贝斯：每拍一个根音（C / A / F / G 进行）
const BGM_BASS = [
  48, null, 48, null, 48, null, 48, null,
  45, null, 45, null, 45, null, 45, null,
  41, null, 41, null, 41, null, 41, null,
  43, null, 43, null, 43, null, 43, null,
];

const BGM = {
  playing: false, step: 0, nextTime: 0,
  bpm: 132, master: null, timer: null, noiseBuf: null,
};

function playBGMStep(step, t) {
  const ctx = _audioCtx;
  const stepDur = 60 / BGM.bpm / 2;
  // 主旋律：方波，轻快明亮
  const m = BGM_MELODY[step];
  if (m != null) {
    const o = ctx.createOscillator();
    o.type = 'square';
    o.frequency.value = noteFreq(m);
    const g = ctx.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.45, t + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, t + stepDur * 0.85);
    o.connect(g); g.connect(BGM.master);
    o.start(t); o.stop(t + stepDur);
  }
  // 贝斯：三角波，浑厚
  const b = BGM_BASS[step];
  if (b != null) {
    const o = ctx.createOscillator();
    o.type = 'triangle';
    o.frequency.value = noteFreq(b);
    const g = ctx.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.7, t + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t + stepDur * 0.95);
    o.connect(g); g.connect(BGM.master);
    o.start(t); o.stop(t + stepDur);
  }
  // 反拍噪声鼓点：短促像素节奏
  if (step % 2 === 1) {
    const src = ctx.createBufferSource();
    src.buffer = BGM.noiseBuf;
    const g = ctx.createGain();
    g.gain.value = 0.16;
    const f = ctx.createBiquadFilter();
    f.type = 'highpass';
    f.frequency.value = 6000;
    src.connect(f); f.connect(g); g.connect(BGM.master);
    src.start(t);
  }
}

function scheduleBGM() {
  const ctx = _audioCtx;
  const stepDur = 60 / BGM.bpm / 2;
  while (BGM.nextTime < ctx.currentTime + 0.18) {
    playBGMStep(BGM.step, BGM.nextTime);
    BGM.nextTime += stepDur;
    BGM.step = (BGM.step + 1) % 32;
  }
}

function startBGM() {
  try {
    const Ctx = window.AudioContext || window.webkitAudioContext;
    if (!Ctx) return;
    if (!_audioCtx) _audioCtx = new Ctx();
    const ctx = _audioCtx;
    if (ctx.state === 'suspended') ctx.resume();
    if (BGM.playing) return;
    BGM.master = ctx.createGain();
    BGM.master.gain.value = 0.16;
    BGM.master.connect(ctx.destination);
    // 预生成噪声缓冲
    const len = Math.floor(ctx.sampleRate * 0.03);
    BGM.noiseBuf = ctx.createBuffer(1, len, ctx.sampleRate);
    const data = BGM.noiseBuf.getChannelData(0);
    for (let i = 0; i < len; i++) data[i] = (Math.random() * 2 - 1) * (1 - i / len);
    BGM.step = 0;
    BGM.nextTime = ctx.currentTime + 0.05;
    BGM.playing = true;
    BGM.timer = setInterval(scheduleBGM, 40);
    updateMusicBtn();
    startNoteFlow();
  } catch (e) { /* 静默忽略音频错误 */ }
}

function stopBGM() {
  if (!BGM.playing) return;
  BGM.playing = false;
  if (BGM.timer) { clearInterval(BGM.timer); BGM.timer = null; }
  if (BGM.master) {
    try { BGM.master.gain.setTargetAtTime(0.0001, _audioCtx.currentTime, 0.1); } catch (e) {}
    BGM.master = null;
  }
  updateMusicBtn();
  stopNoteFlow();
}

function toggleBGM() { BGM.playing ? stopBGM() : startBGM(); }

function updateMusicBtn() {
  document.querySelectorAll('.btn-music .music-icon').forEach(icon => {
    icon.style.opacity = BGM.playing ? '1' : '.4';
  });
}

const quizState = { current: 0, answers: new Array(QUIZ.length).fill(null), typeTimer: null, locked: false };

function playClick() {
  try {
    const Ctx = window.AudioContext || window.webkitAudioContext;
    if (!Ctx) return;
    if (!_audioCtx) _audioCtx = new Ctx();
    const ctx = _audioCtx;
    if (ctx.state === 'suspended') ctx.resume();
    const now = ctx.currentTime;
    const o = ctx.createOscillator();
    o.type = 'square';
    o.frequency.setValueAtTime(880, now);
    o.frequency.exponentialRampToValueAtTime(660, now + 0.08);
    const g = ctx.createGain();
    g.gain.setValueAtTime(0.12, now);
    g.gain.exponentialRampToValueAtTime(0.0001, now + 0.1);
    o.connect(g); g.connect(ctx.destination);
    o.start(now); o.stop(now + 0.12);
  } catch (e) { /* 静默忽略 */ }
}

function showQuiz() {
  document.getElementById('quiz').classList.add('show');
  renderQuestion();
}

function renderQuestion() {
  const q = QUIZ[quizState.current];
  const i = quizState.current;
  quizState.locked = false;
  if (quizState.typeTimer) { clearInterval(quizState.typeTimer); quizState.typeTimer = null; }

  document.getElementById('quizProgress').textContent = `第 ${i + 1} / ${QUIZ.length} 题`;
  document.getElementById('quizProgressFill').style.width = `${(i / QUIZ.length) * 100}%`;
  document.getElementById('quizPrev').style.visibility = i === 0 ? 'hidden' : 'visible';

  const textEl = document.getElementById('dialogText');
  const optsEl = document.getElementById('dialogOptions');
  optsEl.innerHTML = '';
  textEl.textContent = '';
  textEl.classList.add('typing');

  let ci = 0;
  quizState.typeTimer = setInterval(() => {
    textEl.textContent += q.q[ci++];
    if (ci >= q.q.length) {
      clearInterval(quizState.typeTimer);
      quizState.typeTimer = null;
      textEl.classList.remove('typing');
      renderOptions();
    }
  }, 34);
}

function renderOptions() {
  const q = QUIZ[quizState.current];
  const i = quizState.current;
  const optsEl = document.getElementById('dialogOptions');
  optsEl.innerHTML = '';
  q.options.forEach((o, k) => {
    const btn = document.createElement('button');
    btn.className = 'option-btn' + (quizState.answers[i] === k ? ' selected' : '');
    btn.innerHTML = `<span class="key">${'ABCD'[k]}</span><span>${o.t}</span>`;
    btn.addEventListener('click', () => selectOption(k));
    optsEl.appendChild(btn);
  });
}

function selectOption(k) {
  if (quizState.locked) return;
  quizState.locked = true;
  quizState.answers[quizState.current] = k;
  playClick();
  const btns = document.querySelectorAll('#dialogOptions .option-btn');
  btns.forEach((b, idx) => b.classList.toggle('selected', idx === k));
  setTimeout(() => {
    if (quizState.current < QUIZ.length - 1) {
      quizState.current++;
      renderQuestion();
    } else {
      finishQuiz();
    }
  }, 300);
}

function finishQuiz() {
  // 同一指标可能被多题映射（如 diet_food 在 Q1/Q4），累加后取平均
  const sums = {};
  const counts = {};
  QUIZ.forEach((q, i) => {
    const k = quizState.answers[i];
    const s = (k != null && q.options[k]) ? q.options[k].s : 5;
    q.maps.forEach(key => {
      sums[key] = (sums[key] || 0) + s;
      counts[key] = (counts[key] || 0) + 1;
    });
  });
  const scores = {};
  Object.keys(sums).forEach(key => {
    scores[key] = Math.round((sums[key] / counts[key]) * 10) / 10;
  });
  state.scores = scores;
  document.getElementById('quiz').classList.remove('show');
  analyze();
}

document.getElementById('quizPrev').addEventListener('click', () => {

});

document.addEventListener('keydown', (e) => {
  const quizEl = document.getElementById('quiz');
  if (!quizEl.classList.contains('show')) return;
  if (e.key === 'ArrowLeft' && quizState.current > 0) { quizState.current--; renderQuestion(); return; }
  const map = { '1': 0, '2': 1, '3': 2, '4': 3, 'a': 0, 'b': 1, 'c': 2, 'd': 3, 'A': 0, 'B': 1, 'C': 2, 'D': 3 };
  if (e.key in map && !quizState.typeTimer) selectOption(map[e.key]);
});

  const gradeKey = data.grade_level.split(' ')[0];
  // 有对应海报的等级 → 先进入黑幕海报环节，点击「查看报告」后再渲染结果
  if (GRADE_POSTER[gradeKey]) {
    showPoster(gradeKey);
  } else {
    renderResult(data);
  }
}

function showPoster(gradeKey) {
  const poster = GRADE_POSTER[gradeKey];
  document.getElementById('posterImg').src = poster.src;
  document.getElementById('posterImg').alt = `${gradeKey} 立绘海报`;
  document.getElementById('posterOverlay').classList.add('show');
}

document.getElementById('btnViewReport').addEventListener('click', () => {
  document.getElementById('posterOverlay').classList.remove('show');
  if (state.resultData) renderResult(state.resultData);
});

function renderResult(data) {
  // 圆环
  const total = data.total;
  document.getElementById('totalNum').textContent = total;
  const offset = CIRC * (1 - total / 100);
  document.getElementById('ringFill').style.strokeDashoffset = offset;

  // 等级徽章
  const badge = document.getElementById('gradeBadge');
  const gradeKey = data.grade_level.split(' ')[0];
  state.gradeKey = gradeKey;
  badge.style.background = GRADE_COLOR[gradeKey] || '#f97316';
  badge.innerHTML = `<span class="tag">综合评级</span>${data.grade_level}`;
  document.getElementById('gradeDesc').textContent = data.grade_desc;

  // A级及以上 → 礼花筒庆祝
  if (gradeKey === 'A级' || gradeKey === 'S级') {
    setTimeout(launchConfetti, 450);
  }

  // 猫咪从天空坠落 → 落地 → 弹出评语漫画对话框
  const catLand = document.getElementById('catLand');
  const catImg = document.getElementById('catFallImg');
  document.getElementById('catComment').textContent = GRADE_COMMENTS[gradeKey] || '喵~';
  catImg.src = '/static/_frames/cat2.png';
  catLand.classList.remove('drop');
  void catLand.offsetWidth; // 强制回流以重启动画
  catLand.classList.add('drop');
  setTimeout(() => { catImg.src = '/static/_frames/cat3.png'; }, 600);

  // 优化预测
  const proj = document.getElementById('projection');
  if (data.weak_indicators.length > 0) {
    proj.style.display = 'block';
    proj.innerHTML = `落实改进方案后，预计综合指数提升至 <b>${data.projected_total}</b> 分（+${data.projected_delta} 分）`;
  } else {
    proj.style.display = 'none';
  }

  // 图表
  const labels = data.dimensions.map(d => d.name);
  const current = data.dimensions.map(d => d.average);
  const projected = data.dimensions.map(d => Math.min(10, d.projected));

  if (!state.charts.radar) {
    state.charts.radar = new Chart(document.getElementById('radarChart'), {
      type: 'radar',
      data: {
        labels,
        datasets: [
          { label: '当前', data: current, borderColor: '#f97316', backgroundColor: 'rgba(249,115,22,.18)', borderWidth: 2, pointBackgroundColor: '#f97316' },
          { label: '优化后', data: projected, borderColor: '#10b981', backgroundColor: 'rgba(16,185,129,.08)', borderWidth: 2, borderDash: [5,4], pointBackgroundColor: '#10b981' },
        ],
      },
      options: {
        responsive: true, maintainAspectRatio: false,
        scales: { r: { min: 0, max: 10, ticks: { stepSize: 2, color: '#9a8b85' }, grid: { color: '#f3e6da' }, angleLines: { color: '#f3e6da' }, pointLabels: { color: '#3b2f2f', font: { size: 12, weight: 'bold' } } } },
        plugins: { legend: { position: 'bottom', labels: { usePointStyle: true } } },
      },
    });
  } else {
    state.charts.radar.data.datasets[0].data = current;
    state.charts.radar.data.datasets[1].data = projected;
    state.charts.radar.update();
  }

  if (!state.charts.bar) {
    state.charts.bar = new Chart(document.getElementById('barChart'), {
      type: 'bar',
      data: {
        labels,
        datasets: [{ label: '维度平均分', data: current, backgroundColor: labels.map(() => '#f97316'), borderRadius: 8, maxBarThickness: 44 }],
      },
      options: {
        responsive: true, maintainAspectRatio: false,
        scales: { y: { min: 0, max: 10, ticks: { stepSize: 2 } }, x: { ticks: { color: '#6b5b52', font: { size: 11 } } } },
        plugins: { legend: { display: false } },
      },
    });
  } else {
    state.charts.bar.data.datasets[0].data = current;
    state.charts.bar.update();
  }

  // 短板列表
  renderWeak(data.weak_indicators);
}

function renderWeak(weak) {
  const wrap = document.getElementById('weakList');
  if (!weak.length) {
    wrap.innerHTML = '<div class="empty-tip">🎉 未发现低于 7 分的短板指标，猫咪满意度表现全面良好！</div>';
    return;
  }
  wrap.innerHTML = weak.map(w => `
    <div class="weak-item">
      <div class="weak-top">
        <span class="weak-name">${w.name}</span>
        <span class="weak-cat">${w.category}</span>
        <span class="weak-score" style="color:${w.score < 5 ? 'var(--red)' : 'var(--gold)'}">${w.score} 分</span>
      </div>
      <div class="weak-meta">${w.dimension_name} · ${w.band}</div>
      <div class="tip-grid">
        <div><span class="k">频次</span> ${w.tips.freq}</div>
        <div><span class="k">方法</span> ${w.tips.method}</div>
        <div><span class="k">周期</span> ${w.tips.period}</div>
        <div><span class="k">预期</span> ${w.tips.effect}</div>
      </div>
    </div>`).join('');
}

// ---------- 按钮 ----------
document.getElementById('btnReport').addEventListener('click', async () => {
  const res = await fetch('/api/report', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ scores: state.scores }),
  });
  const blob = await res.blob();
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'cat_satisfaction_report.txt';
  a.click();
  URL.revokeObjectURL(a.href);
});

// ---------- 证书 ----------
const GRADE_CERT = {
  'S级': { src: '/static/certificates/S.png', file: 'S级-猫咪家庭满意度证书.png' },
  'A级': { src: '/static/certificates/A.png', file: 'A级-猫咪家庭满意度证书.png' },
  'B级': { src: '/static/certificates/B.png', file: 'B级-猫咪家庭满意度证书.png' },
  'C级': { src: '/static/certificates/C.png', file: 'C级-猫咪家庭满意度证书.png' },
  'D级': { src: '/static/certificates/D.png', file: 'D级-猫咪家庭满意度证书.png' },
  'E级': { src: '/static/certificates/E.png', file: 'E级-猫咪家庭满意度证书.png' },
};
const certModal = document.getElementById('certModal');
const certImg = document.getElementById('certImg');
const certHint = document.getElementById('certHint');
const btnCertSave = document.getElementById('btnCertSave');

document.getElementById('btnCert').addEventListener('click', () => {
  const gk = state.gradeKey;
  if (!gk) { certHint.textContent = '请先完成测评，再领取等级证书～'; return; }
  const cert = GRADE_CERT[gk];
  if (!cert) { certHint.textContent = `${gk} 等级证书正在制作中，敬请期待～`; return; }
  certHint.textContent = `恭喜获得 ${gk} 认证！`;
  certImg.src = cert.src;
  btnCertSave.href = cert.src;
  btnCertSave.download = cert.file;
  certModal.classList.add('show');
});

document.getElementById('certClose').addEventListener('click', () => certModal.classList.remove('show'));
document.getElementById('certBackdrop').addEventListener('click', () => certModal.classList.remove('show'));
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') certModal.classList.remove('show'); });

// ---------- 礼花筒（A级及以上） ----------
const confettiCanvas = document.getElementById('confettiCanvas');
const cctx = confettiCanvas.getContext('2d');
const CONFETTI_COLORS = ['#f97316', '#fbbf24', '#10b981', '#38bdf8', '#f43f5e', '#a78bfa', '#facc15', '#fb7185'];
let confettiParts = [];
let confettiRunning = false;

function resizeConfetti() {
  confettiCanvas.width = window.innerWidth;
  confettiCanvas.height = window.innerHeight;
}
window.addEventListener('resize', resizeConfetti);
resizeConfetti();

// 礼花筒音效：震耳“砰”爆破 + 上行号角 + 人群欢呼（Web Audio 合成）
function playPartyHorn() {
  try {
    const Ctx = window.AudioContext || window.webkitAudioContext;
    if (!Ctx) return;
    if (!_audioCtx) _audioCtx = new Ctx();
    const ctx = _audioCtx;
    if (ctx.state === 'suspended') ctx.resume();
    const now = ctx.currentTime;

    // 1) 三连“砰”爆破：低通噪声 + 次低音重击，更厚重震撼
    for (let k = 0; k < 3; k++) {
      const t = now + k * 0.11;
      const dur = 0.32;
      // 噪声爆破（主爆裂声）
      const bufLen = Math.floor(ctx.sampleRate * dur);
      const buf = ctx.createBuffer(1, bufLen, ctx.sampleRate);
      const d = buf.getChannelData(0);
      for (let i = 0; i < bufLen; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / bufLen, 2.2);
      const src = ctx.createBufferSource();
      src.buffer = buf;
      const f = ctx.createBiquadFilter();
      f.type = 'lowpass';
      f.frequency.value = 3600;
      const g = ctx.createGain();
      g.gain.setValueAtTime(0.85, t);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      src.connect(f); f.connect(g); g.connect(ctx.destination);
      src.start(t);
      // 次低音重击（150Hz → 45Hz 下坠）
      const sub = ctx.createOscillator();
      sub.type = 'sine';
      sub.frequency.setValueAtTime(150, t);
      sub.frequency.exponentialRampToValueAtTime(45, t + dur);
      const sg = ctx.createGain();
      sg.gain.setValueAtTime(0.6, t);
      sg.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      sub.connect(sg); sg.connect(ctx.destination);
      sub.start(t); sub.stop(t + dur + 0.02);
    }

    // 2) 上行号角滑音（双八度叠加，更嘹亮）
    const notes = [523.25, 659.25, 783.99, 1046.5];
    notes.forEach((freq, i) => {
      const t = now + 0.03 + i * 0.09;
      [freq, freq * 2].forEach(ff => {
        const o = ctx.createOscillator();
        o.type = 'square';
        o.frequency.setValueAtTime(ff, t);
        const g = ctx.createGain();
        g.gain.setValueAtTime(0.0001, t);
        g.gain.exponentialRampToValueAtTime(ff === freq ? 0.32 : 0.14, t + 0.02);
        g.gain.exponentialRampToValueAtTime(0.0001, t + 0.2);
        o.connect(g); g.connect(ctx.destination);
        o.start(t); o.stop(t + 0.24);
      });
    });

    // 3) 人群欢呼：多声部带通噪声叠加 + 哨音滑音，模拟“哇~~~”
    const cheerDur = 1.5;
    const cheerBufLen = Math.floor(ctx.sampleRate * cheerDur);
    for (let v = 0; v < 14; v++) {
      const cbuf = ctx.createBuffer(1, cheerBufLen, ctx.sampleRate);
      const cd = cbuf.getChannelData(0);
      for (let i = 0; i < cheerBufLen; i++) cd[i] = Math.random() * 2 - 1;
      const csrc = ctx.createBufferSource();
      csrc.buffer = cbuf;
      const bp = ctx.createBiquadFilter();
      bp.type = 'bandpass';
      bp.Q.value = 1.1;
      const baseF = 650 + Math.random() * 1300;
      bp.frequency.setValueAtTime(baseF, now);
      bp.frequency.exponentialRampToValueAtTime(baseF * (0.85 + Math.random() * 0.4), now + cheerDur);
      const cg = ctx.createGain();
      cg.gain.setValueAtTime(0.0001, now);
      cg.gain.exponentialRampToValueAtTime(0.05 + Math.random() * 0.045, now + 0.22);
      cg.gain.setValueAtTime(0.05 + Math.random() * 0.045, now + 0.55);
      cg.gain.exponentialRampToValueAtTime(0.0001, now + cheerDur);
      csrc.connect(bp); bp.connect(cg); cg.connect(ctx.destination);
      csrc.start(now);
    }
    // 欢呼中的口哨声（正弦上下滑音，模仿“咻——哟！”）
    for (let w = 0; w < 3; w++) {
      const t = now + 0.05 + w * 0.14;
      const o = ctx.createOscillator();
      o.type = 'sine';
      const f0 = 1800 + Math.random() * 600;
      o.frequency.setValueAtTime(f0, t);
      o.frequency.exponentialRampToValueAtTime(f0 * 1.4, t + 0.12);
      o.frequency.exponentialRampToValueAtTime(f0 * 0.8, t + 0.3);
      const g = ctx.createGain();
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(0.06, t + 0.06);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 0.34);
      o.connect(g); g.connect(ctx.destination);
      o.start(t); o.stop(t + 0.4);
    }
  } catch (e) { /* 静默忽略音频错误 */ }
}

function launchConfetti() {
  resizeConfetti();
  playPartyHorn();
  // 两门礼花筒：左下、右下向上喷射
  const origins = [
    { x: confettiCanvas.width * 0.08, y: confettiCanvas.height * 0.92, angle: -Math.PI / 2.5 },
    { x: confettiCanvas.width * 0.92, y: confettiCanvas.height * 0.92, angle: -Math.PI / 1.65 },
  ];
  confettiParts = [];
  const count = 280;
  for (let i = 0; i < count; i++) {
    const o = origins[i % 2];
    const speed = Math.random() * 15 + 9;
    const angle = o.angle + (Math.random() - 0.5) * 0.9;
    confettiParts.push({
      x: o.x + (Math.random() - 0.5) * 20,
      y: o.y,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed,
      size: Math.random() * 8 + 5,
      color: CONFETTI_COLORS[Math.floor(Math.random() * CONFETTI_COLORS.length)],
      rot: Math.random() * Math.PI * 2,
      vr: (Math.random() - 0.5) * 0.4,
      shape: Math.random() > 0.5 ? 'rect' : 'circle',
      life: Math.random() * 70 + 110,
      age: 0,
    });
  }
  if (!confettiRunning) {
    confettiRunning = true;
    requestAnimationFrame(confettiTick);
  }
}

function confettiTick() {
  cctx.clearRect(0, 0, confettiCanvas.width, confettiCanvas.height);
  confettiParts.forEach(p => {
    p.age++;
    p.vy += 0.18;
    p.vx *= 0.99;
    p.x += p.vx;
    p.y += p.vy;
    p.rot += p.vr;
    const alpha = Math.max(0, 1 - p.age / p.life);
    cctx.save();
    cctx.globalAlpha = alpha;
    cctx.translate(p.x, p.y);
    cctx.rotate(p.rot);
    cctx.fillStyle = p.color;
    if (p.shape === 'rect') {
      cctx.fillRect(-p.size / 2, -p.size / 4, p.size, p.size / 2);
    } else {
      cctx.beginPath();
      cctx.arc(0, 0, p.size / 3, 0, Math.PI * 2);
      cctx.fill();
    }
    cctx.restore();
  });
  confettiParts = confettiParts.filter(p => p.age < p.life && p.y < confettiCanvas.height + 40);
  if (confettiParts.length > 0) {
    requestAnimationFrame(confettiTick);
  } else {
    cctx.clearRect(0, 0, confettiCanvas.width, confettiCanvas.height);
    confettiRunning = false;
  }
}

fetchConfig();
</script>
